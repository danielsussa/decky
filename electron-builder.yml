appId: com.danielsussa.decky
productName: decky
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  # .decky/ é workspace state local (cards/transcripts do próprio projeto). Não entra no
  # bundle — pode ter symlinks (ex: cards/bg-review/imgs → src/renderer/src/assets/bg) que
  # apontam pra dirs excluídos por !src/*, batendo ENOENT no electron-builder packaging.
  - '!.decky/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Bundle dky-mcp into a self-contained file before signing (see build/afterPack.cjs) so the
# externally-spawned MCP server can resolve its deps without app.asar.
afterPack: build/afterPack.cjs
# Deep ad-hoc re-sign after signing so the packaged app/dmg launch (see build/afterSign.cjs).
afterSign: build/afterSign.cjs
asarUnpack:
  - resources/**
  # dk-mcp/dk are spawned by an EXTERNAL process (claude reads ~/.claude.json and
  # runs `node <path>`); a path inside app.asar isn't a real file to a non-Electron
  # node, so these must live unpacked on disk.
  - bin/**
  # better-sqlite3 (history DB) is a native module — its .node binary can't be loaded
  # from inside app.asar by dlopen, so unpack it (and its runtime closure) to disk.
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
win:
  executableName: decky
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Local stable self-signed identity (see build/make-signing-cert.sh). Anchors the
  # TCC designated requirement to the CERT (not the per-build CDHash), so granted
  # permissions survive rebuilds instead of re-prompting every install. Not from
  # Apple => no notarization; fine for local use only.
  identity: Decky Local Code Signing
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
