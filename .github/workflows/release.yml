name: Release

# Build, sign (Developer ID) and notarize the macOS app, then publish DMGs to a
# GitHub Release. Triggered by pushing a tag like `v0.1.0`, or manually.
#
# Secrets used (set on the repo):
#   APPLE_DEVID_P12_BASE64    — Developer ID Application cert + key (.p12), base64
#   APPLE_DEVID_P12_PASSWORD  — password for the .p12
#   APPLE_SIGNING_IDENTITY    — "Developer ID Application: … (TEAMID)"
#   APPLE_API_P8_BASE64       — App Store Connect API key (.p8), base64 (notarization)
#   APPLE_API_KEY_ID          — the key's 10-char ID
#   APPLE_API_ISSUER_ID       — the issuer UUID
#
# The local-only signing config in electron-builder.yml (self-signed identity,
# notarize:false) is overridden here via --config.* — the .yml is left untouched
# so local dev builds keep working.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          # Intel (x64) é dropado: o cask publicado sempre foi arm-only e o runner
          # macos-13 ficava emperrado na fila por horas, segurando o update-cask
          # (needs: build). Pra re-habilitar Intel, recoloque a entrada x64/macos-13
          # aqui E restaure o sha intel no render do cask + no packaging/decky.rb.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_P8_BASE64 }}" | base64 -d > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign & notarize
        env:
          # electron-builder imports this .p12 into a temporary keychain itself.
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          # @electron/notarize (driven by mac.notarize:true) reads these.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          # APPLE_API_KEY is exported above into $GITHUB_ENV.
        run: |
          npx electron-vite build
          npx electron-builder --mac dmg --${{ matrix.arch }} \
            --config.mac.identity="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            --config.mac.notarize=true \
            --config.dmg.artifactName='${name}-${version}-${arch}.${ext}' \
            --publish never

      - name: Checksums
        run: shasum -a 256 dist/*.dmg

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true

      - name: Upload DMG artifact (for cask bump)
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg

  # After both arches build & publish, render the cask with the real sha256s and
  # push it to the Homebrew tap (danielsussa/homebrew-decky) over a write deploy key.
  update-cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # app repo — for packaging/decky.rb (cask template)

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render cask with checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA=$(shasum -a 256 artifacts/dmg-arm64/*.dmg | awk '{print $1}')
          echo "version=$VERSION  arm=$ARM_SHA"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/REPLACE_WITH_ARM64_DMG_SHA256/$ARM_SHA/" \
              packaging/decky.rb > /tmp/decky.rb

      - name: Push to Homebrew tap
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:danielsussa/homebrew-decky.git tap
          cp /tmp/decky.rb tap/Casks/decky.rb
          cd tap
          git config user.name "decky-ci"
          git config user.email "ci@decky.local"
          git add Casks/decky.rb
          git commit -m "decky ${GITHUB_REF_NAME#v}" || { echo "no changes"; exit 0; }
          git push origin HEAD
