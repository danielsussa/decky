name: Release

# Build, sign (Developer ID) and notarize the macOS app, then publish DMGs to a
# GitHub Release. Triggered by pushing a tag like `v0.1.0`, or manually.
#
# Secrets used (set on the repo):
#   APPLE_DEVID_P12_BASE64    — Developer ID Application cert + key (.p12), base64
#   APPLE_DEVID_P12_PASSWORD  — password for the .p12
#   APPLE_SIGNING_IDENTITY    — "Developer ID Application: … (TEAMID)"
#   APPLE_API_P8_BASE64       — App Store Connect API key (.p8), base64 (notarization)
#   APPLE_API_KEY_ID          — the key's 10-char ID
#   APPLE_API_ISSUER_ID       — the issuer UUID
#
# The local-only signing config in electron-builder.yml (self-signed identity,
# notarize:false) is overridden here via --config.* — the .yml is left untouched
# so local dev builds keep working.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_P8_BASE64 }}" | base64 -d > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign & notarize
        env:
          # electron-builder imports this .p12 into a temporary keychain itself.
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          # @electron/notarize (driven by mac.notarize:true) reads these.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          # APPLE_API_KEY is exported above into $GITHUB_ENV.
        run: |
          npx electron-vite build
          npx electron-builder --mac dmg --${{ matrix.arch }} \
            --config.mac.identity="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            --config.mac.notarize=true \
            --config.dmg.artifactName='${name}-${version}-${arch}.${ext}' \
            --publish never

      - name: Checksums
        run: shasum -a 256 dist/*.dmg

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
